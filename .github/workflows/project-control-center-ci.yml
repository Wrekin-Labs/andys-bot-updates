name: Project Control Center CI

on:
  push:
    paths:
      - "project-control-center/**"
      - ".github/workflows/project-control-center-ci.yml"
  pull_request:
    paths:
      - "project-control-center/**"
      - ".github/workflows/project-control-center-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run verify
