name: R7.2 Safety Tests

on:
  push:
    branches:
      - r7-2-safety-performance-hardening
  pull_request:
    paths:
      - "r7_2_edge/**"
      - "tests/**"
      - ".github/workflows/r7-2-safety-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run R7.2 unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
