name: Wrekin WordPress Manager

on:
  push:
    branches:
      - wrekin-cloud-v0.1
    paths:
      - 'wrekin-cloud/**'
      - 'wrekin-wordpress-connector/**'
      - '.github/workflows/wrekin-wordpress.yml'
  pull_request:
    paths:
      - 'wrekin-cloud/**'
      - 'wrekin-wordpress-connector/**'
      - '.github/workflows/wrekin-wordpress.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrekin-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check server.js
      - name: WordPress Manager tests
        run: npm test
      - name: Verify connector release checksum
        working-directory: .
        run: |
          echo "B72271D8629C1819BE2B65C4378B6C86F939F91C3178636E641B6BC07B37CB06  releases/wrekin-wordpress-connector.zip" | sha256sum -c -


