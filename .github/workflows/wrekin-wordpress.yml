name: Wrekin WordPress Manager

on:
  push:
    branches:
      - wrekin-cloud-v0.1
    paths:
      - 'wrekin-cloud/**'
      - 'wrekin-wordpress-connector/**'
      - '.github/workflows/wrekin-wordpress.yml'
  pull_request:
    paths:
      - 'wrekin-cloud/**'
      - 'wrekin-wordpress-connector/**'
      - '.github/workflows/wrekin-wordpress.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrekin-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check server.js
      - name: WordPress Manager tests
        run: npm test
      - name: Verify connector release checksum
        working-directory: .
        run: |
          echo "1FF517404977F019D90D72E583924C34E09AE6AE8E5A66CB2939A742AC2E7BA4  releases/wrekin-wordpress-connector.zip" | sha256sum -c -



  # Packaging compatibility verified separately: ZIP entry paths use forward slashes.
