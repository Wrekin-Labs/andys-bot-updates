name: Jarvis Android preview
on:
  push:
    branches: [feature/jarvis-android-20261108]
    paths: ['jarvis-android/**', 'research/jarvis-2/prototype/**', '.github/workflows/jarvis-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test existing ledger and mobile export
        working-directory: research/jarvis-2/prototype
        run: python -m unittest discover -v
      - name: Test private AI bridge
        run: python -m unittest discover -s jarvis-android/bridge -v
      - name: Build and lint preview APK
        working-directory: jarvis-android
        run: gradle --no-daemon assembleRelease testDebugUnitTest lintRelease
      - name: Show lint report
        if: always()
        run: cat jarvis-android/app/build/reports/lint-results-release.txt || true
      - name: Include signing utility (no keys)
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" jarvis-android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-0.2.0-unsigned
          path: jarvis-android/app/build/outputs/apk/release/
          if-no-files-found: error
