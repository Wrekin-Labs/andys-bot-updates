plugins { id 'com.android.application' }
android {
    namespace 'uk.wrekinlabs.jarvis'
    compileSdk 35
    defaultConfig { applicationId 'uk.wrekinlabs.jarvis.dev'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0-preview'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
