// Python Club v3.1 — friendly exercise checker
// Keep hidden checker failures out of the learner's Output panel.

function visibleText(value) {
  return String(value).replace(/\r\n/g, '\n').replace(/\r/g, '\n').trimEnd();
}

function compactWhitespace(value) {
  return visibleText(value).replace(/[ \t]+/g, ' ');
}

function diagnoseOutput(actual, expected) {
  const a = visibleText(actual);
  const e = visibleText(expected);
  if (a === e) return { ok: true, message: 'Perfect — your output matches exactly.' };

  const tips = [];
  if (a.toLowerCase() === e.toLowerCase() && a !== e) {
    tips.push('Check capital letters — Python Club is asking for the text exactly as shown.');
  }
  if (compactWhitespace(a) === compactWhitespace(e) && a !== e) {
    tips.push('Check extra spaces. There may be a space before punctuation or between words.');
  }
  if (a.replace(/\s+/g, '') === e.replace(/\s+/g, '') && a !== e) {
    tips.push('The characters are nearly right, but the spacing is different.');
  }
  if (a.replace(/[.!?]/g, '') === e.replace(/[.!?]/g, '') && a !== e) {
    tips.push('Check the punctuation at the end.');
  }
  if (!tips.length) tips.push('Compare your output with the target one character at a time.');

  return {
    ok: false,
    message: 'Nearly there — your program ran, but the result is not an exact match.',
    actual: a || '(nothing)',
    expected: e || '(nothing)',
    tips
  };
}

function renderFriendlyCheck(container, result) {
  if (result.ok) {
    container.innerHTML = `<div class="check-success"><strong>✓ That’s right!</strong><p>${result.message}</p></div>`;
    return;
  }
  container.innerHTML = `
    <div class="check-nearly">
      <strong>Almost there</strong>
      <p>${result.message}</p>
      <div class="compare-row"><span>Your output</span><code>${escapeHtml(result.actual)}</code></div>
      <div class="compare-row"><span>Target</span><code>${escapeHtml(result.expected)}</code></div>
      <ul>${result.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
      <p class="encourage">Your code ran successfully. Fix the small difference and check again.</p>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

let pyodideV4=null,pyodideLoading=null;
async function ensurePyodide(){if(pyodideV4)return pyodideV4;if(pyodideLoading)return pyodideLoading;pyodideLoading=(async()=>{if(!window.loadPyodide){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}pyodideV4=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});return pyodideV4})();return pyodideLoading}
async function runPythonV4(code){try{const py=await ensurePyodide();let lines=[];py.setStdout({batched:s=>lines.push(s)});py.setStderr({batched:s=>lines.push(s)});await py.runPythonAsync(code);return lines.join('\n')||'(no output)'}catch(e){const fallback=simulatePython(code);if(fallback&&fallback!=='[This lesson needs the full Python runner]')return fallback;throw e}}
function friendlyRuntimeError(e){const msg=String(e&&e.message||e||'').split('\n').filter(Boolean);const useful=msg.find(x=>/(SyntaxError|NameError|TypeError|ValueError|IndentationError|ZeroDivisionError|ModuleNotFoundError)/.test(x))||msg[msg.length-1]||'The program could not run.';return `Your program hit a problem.\n${useful.replace(/^.*?(SyntaxError|NameError|TypeError|ValueError|IndentationError|ZeroDivisionError|ModuleNotFoundError)/,'$1')}\n\nTip: check the highlighted line, spelling, brackets, quotes and indentation.`}

/* Python Club v5.0 — mastery, review, portfolio, code history, parent analytics and challenge layer */
const V5_ACTIVITY='pythonClubV5Activity';
const V5_REVIEW='pythonClubV5Review';
const V5_PORTFOLIO='pythonClubV5Portfolio';
const V5_PROJECT_META='pythonClubV5ProjectMeta';
const V5_SNAPSHOTS='pythonClubV5Snapshots';
const V5_PREFS='pythonClubV5Prefs';
let v5activity=JSON.parse(store.getItem(V5_ACTIVITY)||'[]');
let v5review=JSON.parse(store.getItem(V5_REVIEW)||'{}');
let v5portfolio=JSON.parse(store.getItem(V5_PORTFOLIO)||'[]');
let v5projectMeta=JSON.parse(store.getItem(V5_PROJECT_META)||'{}');
let v5snapshots=JSON.parse(store.getItem(V5_SNAPSHOTS)||'{}');
let v5prefs=JSON.parse(store.getItem(V5_PREFS)||'null')||{weeklyGoal:3,focus:'balanced',parentPin:'',compactPath:false};
function v5save(){store.setItem(V5_ACTIVITY,JSON.stringify(v5activity.slice(-500)));store.setItem(V5_REVIEW,JSON.stringify(v5review));store.setItem(V5_PORTFOLIO,JSON.stringify(v5portfolio));store.setItem(V5_PROJECT_META,JSON.stringify(v5projectMeta));store.setItem(V5_SNAPSHOTS,JSON.stringify(v5snapshots));store.setItem(V5_PREFS,JSON.stringify(v5prefs))}
function logActivity(type,label,meta={}){v5activity.push({ts:new Date().toISOString(),learner:activeLearner()?.id,type,label,meta});v5save()}
function activeActivity(days=7){const cutoff=Date.now()-days*86400000,id=activeLearner()?.id;return v5activity.filter(x=>x.learner===id&&new Date(x.ts).getTime()>=cutoff)}
function completedByTrack(a=activeLearner()){return tracks.map(t=>{const ids=allLessons.map((l,i)=>[l,i]).filter(([l])=>l.track===t.name).map(([,i])=>i),done=ids.filter(i=>(a.done||[]).includes(i)).length;return{name:t.name,icon:t.icon,total:ids.length,done,pct:Math.round(done/ids.length*100)}})}
function learningPace(){const a=activeActivity(7),lessons=a.filter(x=>x.type==='lesson').length,practice=a.filter(x=>x.type==='practice').length,projects=a.filter(x=>x.type==='project').length;return{lessons,practice,projects,total:lessons+practice+projects}}
function weekKey(d=new Date()){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return `${x.getUTCFullYear()}-W${String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}`}
function weeklyCount(){const wk=weekKey(),id=activeLearner()?.id;return v5activity.filter(x=>x.learner===id&&weekKey(new Date(x.ts))===wk&&['lesson','practice','project'].includes(x.type)).length}
function reviewDueIds(){const a=activeLearner(),now=Date.now();return (a.done||[]).filter(id=>{const r=v5review[a.id+'-'+id];return !r||new Date(r.next).getTime()<=now}).slice(0,12)}
function scheduleReview(id,quality=3){const key=activeLearner().id+'-'+id,old=v5review[key]||{interval:1};let interval=quality>=4?Math.max(2,Math.round(old.interval*2.2)):quality===3?Math.max(1,Math.round(old.interval*1.5)):1;v5review[key]={last:new Date().toISOString(),interval,next:new Date(Date.now()+interval*86400000).toISOString(),quality};v5save()}

function addV5Tabs(){const nav=document.querySelector('.tabs');[['review','Review'],['showcase','Showcase'],['roadmap','Roadmap']].forEach(([id,label])=>{if(!document.getElementById(id)){const b=document.createElement('button');b.dataset.tab=id;b.textContent=label;nav.appendChild(b);const s=document.createElement('section');s.id=id;s.className='panel';nav.parentNode.appendChild(s)}});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=document.getElementById(b.dataset.tab);if(p)p.classList.add('active');if(b.dataset.tab==='review')renderReview();if(b.dataset.tab==='showcase')renderShowcase();if(b.dataset.tab==='roadmap')renderRoadmap();if(b.dataset.tab==='family')setTimeout(()=>{renderParentReport();renderV5Parent()},0)})}

function renderV5Banner(){let el=document.getElementById('v5Banner');if(!el){el=document.createElement('section');el.id='v5Banner';el.className='card v5Banner';document.querySelector('.hero')?.insertAdjacentElement('afterend',el)}const pace=learningPace(),goal=v5prefs.weeklyGoal||3,count=weeklyCount(),due=reviewDueIds().length;el.innerHTML=`<div><span class="eyebrow">THIS WEEK</span><b>${count}/${goal} learning wins</b><small>${pace.lessons} lessons · ${pace.practice} practice · ${pace.projects} projects</small></div><div class="weekBar"><i style="width:${Math.min(100,Math.round(count/goal*100))}%"></i></div><button class="chip" onclick="document.querySelector('[data-tab=review]').click()">${due?due+' reviews due':'Review queue clear ✓'}</button>`}

function renderReview(){const due=reviewDueIds();review.innerHTML=`<div class="card reviewHero"><span class="eyebrow">SPACED REVIEW</span><h2>Remember it for longer.</h2><p>Python Club brings completed ideas back just before you are likely to forget them.</p></div>${due.length?`<div class="grid">${due.map(id=>{const l=allLessons[id];return `<div class="card reviewCard"><span class="badge">${l.trackIcon} ${l.track}</span><h3>${esc(l.title)}</h3><p>Quick recall: explain the idea first, then reopen the lesson if you need it.</p><div class="row"><button class="btn" onclick="startReview(${id})">Review now</button><button class="btn secondary" onclick="scheduleReview(${id},4);renderReview()">I know this well</button></div></div>`}).join('')}</div>`:`<div class="card emptyState"><h3>🎉 Nothing due right now.</h3><p>Complete another lesson or come back later. Your review queue will build automatically.</p></div>`}`}
function startReview(id){const l=allLessons[id];modal.classList.remove('hidden');modalContent.innerHTML=`<button class="ghost" onclick="closeModal()">Close</button><span class="badge">Review</span><h2>${esc(l.title)}</h2><p><b>Without looking back:</b> explain this idea in your own words.</p><textarea id="reviewRecall" class="bigText" placeholder="What do you remember?"></textarea><details><summary>Show original explanation</summary><p>${esc(l.why)}</p><pre class="code">${esc(l.example)}</pre></details><h3>How did that feel?</h3><div class="choiceGrid"><button class="choice" onclick="finishReview(${id},2)">😕 Hard</button><button class="choice" onclick="finishReview(${id},3)">🙂 Okay</button><button class="choice" onclick="finishReview(${id},4)">😎 Easy</button></div>`}
function finishReview(id,q){scheduleReview(id,q);state.xp=(state.xp||0)+5;syncFamilyFromState();logActivity('review',allLessons[id].title,{quality:q});document.querySelector('#xp').textContent=state.xp;modalContent.innerHTML=`<div class="check-success"><b>Review complete — +5 XP</b><p>I’ll bring this idea back at the right time.</p></div><button class="btn" onclick="closeModal();renderReview();renderV5Banner()">Done</button>`}

function renderShowcase(){const a=activeLearner();const cards=v5portfolio.filter(x=>x.learner===a.id);showcase.innerHTML=`<div class="card showcaseHero"><span class="eyebrow">MY SHOWCASE</span><h2>Proof of what you can build.</h2><p>Save finished projects here so progress becomes a real portfolio, not just a score.</p><button class="btn" onclick="addShowcaseItem()">+ Add finished project</button></div>${cards.length?`<div class="grid">${cards.map((x,i)=>`<div class="card portfolioCard"><span class="badge">${esc(x.level||'Project')}</span><h3>${esc(x.title)}</h3><p>${esc(x.summary||'')}</p><small>${new Date(x.date).toLocaleDateString()}</small><div class="row"><button class="textBtn" onclick="openPortfolioItem('${x.id}')">View</button><button class="textBtn" onclick="removePortfolioItem('${x.id}')">Remove</button></div></div>`).join('')}</div>`:`<div class="card emptyState"><h3>Your portfolio starts with one finished thing.</h3><p>Complete a guided project, then add it here with a short explanation of what you learned.</p></div>`}`}
function addShowcaseItem(){const title=prompt('Project title');if(!title)return;const summary=prompt('In one or two sentences, what did you build and learn?')||'';v5portfolio.push({id:'pf-'+Date.now(),learner:activeLearner().id,title,summary,date:new Date().toISOString(),level:'Project'});v5save();logActivity('project',title);renderShowcase();renderV5Banner()}
function openPortfolioItem(id){const x=v5portfolio.find(p=>p.id===id);if(!x)return;modal.classList.remove('hidden');modalContent.innerHTML=`<button class="ghost" onclick="closeModal()">Close</button><span class="badge">Portfolio</span><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p><p><b>Added:</b> ${new Date(x.date).toLocaleString()}</p><div class="hint">Try explaining this project to someone else without looking at the code. Teaching is one of the best tests of understanding.</div>`}
function removePortfolioItem(id){if(confirm('Remove this item from the showcase?')){v5portfolio=v5portfolio.filter(x=>x.id!==id);v5save();renderShowcase()}}

function renderRoadmap(){const by=completedByTrack();const rec=recommendedLesson();roadmap.innerHTML=`<div class="card roadmapHero"><span class="eyebrow">FULL ROADMAP</span><h2>From first line → real developer skills.</h2><p>You never need to guess what comes next. The course grows from fundamentals into software engineering, AI and blockchain concepts.</p></div><div class="roadmapList">${by.map((t,i)=>`<div class="card roadmapStage ${t.pct===100?'complete':''}"><div class="roadIcon">${t.icon}</div><div><small>STAGE ${i+1}</small><h3>${esc(t.name)}</h3><p>${t.done}/${t.total} lessons complete</p><div class="progressbar"><i style="width:${t.pct}%"></i></div></div><b>${t.pct}%</b></div>`).join('')}</div><div class="card nextSkill"><span class="eyebrow">NEXT SKILL</span><h3>${esc(allLessons[rec].title)}</h3><p>${esc(allLessons[rec].why)}</p><button class="btn" onclick="openLesson(${rec})">Continue learning →</button></div>`}

function renderV5Parent(){const f=document.getElementById('family');if(!f||f.querySelector('.v5Parent'))return;const a=activeLearner(),pace=learningPace(),by=completedByTrack(),due=reviewDueIds().length;const box=document.createElement('div');box.className='card v5Parent';box.innerHTML=`<span class="eyebrow">PARENT CONTROLS & ANALYTICS</span><h2>${esc(a.name)} at a glance</h2><div class="metricGrid"><div><b>${weeklyCount()}</b><span>Wins this week</span></div><div><b>${due}</b><span>Reviews due</span></div><div><b>${v5portfolio.filter(x=>x.learner===a.id).length}</b><span>Showcase projects</span></div><div><b>${pace.total}</b><span>Activities / 7 days</span></div></div><h3>Track mastery</h3>${by.map(t=>`<div class="masteryRow"><span>${t.icon} ${t.name}</span><div class="progressbar"><i style="width:${t.pct}%"></i></div><b>${t.pct}%</b></div>`).join('')}<div class="parentSettings"><label>Weekly learning goal <select id="weeklyGoal">${[1,2,3,4,5,7].map(n=>`<option value="${n}" ${v5prefs.weeklyGoal===n?'selected':''}>${n} wins</option>`).join('')}</select></label><button class="btn secondary" onclick="v5prefs.weeklyGoal=Number(document.querySelector('#weeklyGoal').value);v5save();renderV5Banner();renderFamily();setTimeout(renderV5Parent,0)">Save goal</button><button class="btn secondary" onclick="exportCsvReport()">Export CSV report</button><button class="btn secondary" onclick="showActivityLog()">Recent activity</button></div>`;f.appendChild(box)}
function exportCsvReport(){const a=activeLearner();const rows=[['date','type','activity'],...v5activity.filter(x=>x.learner===a.id).map(x=>[x.ts,x.type,x.label])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),ln=document.createElement('a');ln.href=u;ln.download=`python-club-${(a.name||'learner').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-report.csv`;ln.click();URL.revokeObjectURL(u)}

function codeConceptSteps(code){
 const lines=String(code||'').split('\n'); const vars={}; const steps=[];
 lines.forEach((raw,idx)=>{const line=raw.trim(); if(!line||line.startsWith('#'))return;
  let note='Python reads this line.';

  else if(/^print\s*\(/.test(line)) note='Evaluate what is inside print(…) and display the result.';
  else if(/^for\s+/.test(line)) note='Start a loop and repeat the indented block.';

async function runV10Coach(check){
 const idx=v10CoachIndex(),c=v10CoachChallenges[idx],ed=document.getElementById('v10CoachCode'),out=document.getElementById('v10CoachOutput'),fb=document.getElementById('v10CoachFeedback');
 if(!ed||!out)return; const code=ed.value; out.textContent='Running Python…';v10Log('code',1);
 let actual='';
 try{actual=await runPythonV4(code)}catch(e){actual=friendlyRuntimeError(e)}
 out.textContent=actual;
 if(!check)return;
 const ok=String(actual).trim()===String(c.expected).trim();
 const d=v10Learner();d.coachAttempts[idx]=(d.coachAttempts[idx]||0)+1;
 if(ok){
   if(!d.coachPassed.includes(idx)){
    d.coachPassed.push(idx);state.xp=(state.xp||0)+25;try{syncFamilyFromState()}catch(e){}
   }
   v10Save();if(fb)fb.innerHTML='<div class="v10CoachFeedback pass"><b>✓ Passed</b><p>Your output matches. Now change one part and predict what will happen before you run it again.</p><button class="btn" onclick="renderV10Coach()">Next challenge →</button></div>';
 }else{
   v10Save();if(fb)fb.innerHTML=`<div class="v10CoachFeedback try"><b>Not yet — keep the code.</b><p>Your program ran, but the result does not match the goal. Compare punctuation, capitals, values and the order of your steps.</p><button class="textBtn" onclick="v10ShowHint()">Show a small hint</button></div>`;
 }
 try{document.getElementById('xp').textContent=state.xp}catch(e){}
}
function v10ShowHint(){
 const idx=v10CoachIndex(),c=v10CoachChallenges[idx],d=v10Learner(),used=Math.min((d.coachAttempts[idx]||0),c.hints.length-1);
 const area=document.getElementById('v10HintArea');if(!area)return;
 const current=area.querySelectorAll('.v10Hint[data-real]').length;
 const n=Math.min(current,c.hints.length-1);
 area.innerHTML=[...Array(n+1)].map((_,i)=>`<div class="v10Hint" data-real="1">💡 ${esc(c.hints[i])}</div>`).join('');
}
async function v10AiReview(){
 const endpoint=v4settings?.tutorEndpoint||'',code=document.getElementById('v10CoachCode')?.value||'',idx=v10CoachIndex(),c=v10CoachChallenges[idx];
 if(!endpoint){alert('Connect the secure tutor backend first.');return}
 const fb=document.getElementById('v10CoachFeedback');if(fb)fb.innerHTML='<div class="v10CoachFeedback">Asking coach…</div>';
 try{
  const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   question:`Review this Python attempt for the challenge "${c.goal}". Give feedback and one next hint. Do not replace the learner's code with a complete answer unless absolutely necessary.\n\nCODE:\n${code}`,
   learner:{name:state.name,completed:(state.done||[]).length},
   instruction:'Act as a Python coach. Ask or explain, then give one actionable next step.'
  })}); if(!r.ok)throw Error('Tutor returned '+r.status);const data=await r.json();
  if(fb)fb.innerHTML=`<div class="v10CoachFeedback"><b>AI coach review</b><p>${esc(data.answer||data.message||'No review returned.')}</p></div>`;
 }catch(e){if(fb)fb.innerHTML=`<div class="v10CoachFeedback try"><b>AI coach unavailable</b><p>${esc(friendlyRuntimeError(e))}</p></div>`}
}

 <div class="card" style="margin-top:14px;padding:18px"><span class="eyebrow">UNDERSTAND AI-GENERATED CODE</span><h2>Explain & Trace</h2><p>Paste code, then step through it line by line. The goal is to understand every meaningful line before relying on it.</p><div class="v13Explain"><textarea id="v13ExplainCode">total = 0\nfor n in [2, 4, 6]:\n    total += n\nprint(total)</textarea><div><div id="v13ExplainOutput" class="v13Output">Press Explain lines or Run & trace.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="explainV13Lines()">Explain lines</button><button class="btn secondary" onclick="runV13Trace()">Run & trace</button></div></div></div></div>
 <div class="card" style="margin-top:14px;padding:18px"><span class="eyebrow">AGENTIC ENGINEERING</span><h2>${core>=100?'Ready to practise with guardrails':'Unlock after strong foundations'}</h2><p>${core>=100?'Use AI to accelerate building, but still review architecture, diffs, tests and security.':'Finish the Core Skills path first. During the fundamentals stage, AI should act mainly as a tutor rather than writing everything for you.'}</p><div class="row"><button class="btn ${core>=100?'':'secondary'}" onclick="v11Go('buildlab')" ${core>=100?'':'disabled'}>Open AI Build Lab</button><button class="btn secondary" onclick="v11Go('projects')">Build projects</button></div></div>`;
}
function openV13Toy(){const t=v13ToyProblems[v13.toyIndex];modal.classList.remove('hidden');modalContent.innerHTML=`<div class="modalTop"><div><span class="eyebrow">TOY PROBLEM</span><h2>${esc(t.q)}</h2></div><button class="ghost" onclick="closeModal()">Close</button></div><textarea id="v13ToyCode" style="width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace">${escText(t.starter)}</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="runV13Toy()">Run</button><button class="btn secondary" onclick="nextV13Toy()">Another toy problem</button></div><h3>Output</h3><div id="v13ToyOut" class="v13Output">Run your code.</div>`}
async function runV13Toy(){const code=document.getElementById('v13ToyCode')?.value||'',out=document.getElementById('v13ToyOut');if(out)out.textContent='Running…';try{const r=await runPythonV4(code);if(out)out.textContent=r||'(no output)';if(typeof v10Log==='function')v10Log('code',1)}catch(e){if(out)out.textContent=friendlyRuntimeError(e)}}
function nextV13Toy(){v13.toyIndex=(v13.toyIndex+1)%v13ToyProblems.length;v13Save();openV13Toy()}
function explainV13Lines(){const code=document.getElementById('v13ExplainCode')?.value||'',out=document.getElementById('v13ExplainOutput');if(!out)return;out.textContent=code.split('\n').map((line,i)=>{const s=line.trim();let msg='Python executes this statement.';if(!s)msg='Blank line for readability.';else if(s.startsWith('#'))msg='Comment for humans; Python ignores it.';else if(/^for\s/.test(s))msg='Loop: take the next item from an iterable.';else if(/^while\s/.test(s))msg='Loop: repeat while the condition is true.';else if(/^if\s/.test(s))msg='Decision: run the indented block if the condition is true.';else if(/^elif\s/.test(s))msg='Alternative condition.';else if(/^else:/.test(s))msg='Fallback branch.';else if(/^def\s/.test(s))msg='Function definition.';else if(/^return\b/.test(s))msg='Send a value back to the caller.';else if(/^print\(/.test(s))msg='Display a value as output.';else if(/\+=/.test(s))msg='Update an existing value by adding to it.';else if(/=/.test(s)&&!/==|>=|<=|!=/.test(s))msg='Assignment: store a value in a name.';return `${i+1}. ${line||' '}  ← ${msg}`}).join('\n')}
async function runV13Trace(){const code=document.getElementById('v13ExplainCode')?.value||'',out=document.getElementById('v13ExplainOutput');if(!out)return;out.textContent='Running…';try{const r=await runPythonV4(code);out.textContent=`Program output:\n${r||'(no output)'}\n\nTip: now press “Explain lines” and compare the explanation with the result.`}catch(e){out.textContent=friendlyRuntimeError(e)}}
function initV13(){const nav=document.querySelector('.tabs');if(!document.getElementById('modern')){const b=document.createElement('button');b.dataset.tab='modern';b.textContent='Modern Path';const core=nav?.querySelector('[data-tab="core"]');(core||nav?.lastElementChild)?.insertAdjacentElement(core?'afterend':'beforebegin',b);const s=document.createElement('section');s.id='modern';s.className='panel';document.querySelector('main')?.appendChild(s)||document.body.appendChild(s)}nav?.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;setTimeout(()=>{if(b.dataset.tab==='modern')renderV13Modern()},30)},true);renderV13Modern()}
initV13();

</script>

<script>
/* ===== Python Club v14 — AI Engineer Career Path ===== */
const V14_KEY='pythonClubV14AIEngineer';
let v14=JSON.parse(store.getItem(V14_KEY)||'null')||{done:[],labs:{},quiz:{},capstones:{}};
function v14Save(){store.setItem(V14_KEY,JSON.stringify(v14))}
const v14Modules=[
 {id:'prod-python',phase:'FOUNDATIONS',icon:'🐍',title:'Production Python',why:'Move from scripts to maintainable services.',skills:['typing','dataclasses','exceptions','async/await','packages','logging'],study:['Type hints make interfaces explicit and easier to review.','async/await is useful for I/O-heavy services such as model/API calls.','Configuration and secrets should be separate from source code.'],lab:'Build a typed async retry helper with logging and bounded retries.',starter:`import asyncio\nfrom dataclasses import dataclass\n\n@dataclass\nclass RetryConfig:\n    attempts: int = 3\n    delay_s: float = 0.2\n\nasync def retry(fn, config: RetryConfig):\n    # TODO: call fn, retry failures, then re-raise\n    pass\n`,check:['async def retry','for ','await ','raise']},
 {id:'fastapi',phase:'APPLICATION ENGINEERING',icon:'⚡',title:'FastAPI + API Design',why:'Expose AI capabilities as clear, validated services.',skills:['FastAPI','Pydantic','OpenAPI','HTTP','auth','rate limits'],study:['Use request/response models to validate data at boundaries.','Separate transport, domain logic and provider code.','Return useful errors without exposing secrets or internals.'],lab:'Design a /summarise endpoint with validated input and a typed response.',starter:`from fastapi import FastAPI\nfrom pydantic import BaseModel, Field\n\napp = FastAPI()\n\nclass SummaryRequest(BaseModel):\n    text: str = Field(min_length=1, max_length=12000)\n\nclass SummaryResponse(BaseModel):\n    summary: str\n\n@app.post('/summarise', response_model=SummaryResponse)\nasync def summarise(req: SummaryRequest):\n    # TODO: call your service layer\n    return SummaryResponse(summary=req.text[:120])\n`,check:['FastAPI','BaseModel','@app.post','response_model']},
 {id:'llm-api',phase:'LLM ENGINEERING',icon:'🧠',title:'LLM APIs + Structured Outputs',why:'Use models predictably instead of treating them like magic.',skills:['messages','token budgets','streaming','retries','schemas','structured output'],study:['Treat model output as untrusted data until validated.','Prefer schemas/structured outputs when software needs reliable fields.','Plan latency, token use, timeouts and retry behaviour.'],lab:'Create a provider wrapper that returns a validated SupportTicket object.',starter:`from dataclasses import dataclass\n\n@dataclass\nclass SupportTicket:\n    category: str\n    priority: str\n    summary: str\n\ndef validate_ticket(data: dict) -> SupportTicket:\n    required = {'category','priority','summary'}\n    # TODO: reject missing keys, then construct SupportTicket\n    pass\n`,check:['SupportTicket','required','raise','return SupportTicket']},
 {id:'agents',phase:'LLM ENGINEERING',icon:'🧭',title:'Tools, Agents + Handoffs',why:'Build bounded agent workflows that can act through explicit tools.',skills:['tool schemas','handoffs','routing','state','guardrails','tracing'],study:['An agent should have clear instructions, bounded tools and observable state.','Use handoffs/routing when specialist agents have distinct responsibilities.','Never give an agent more authority than the task requires.'],lab:'Design a triage agent that routes billing and technical requests to specialist handlers.',starter:`def route_request(text: str) -> str:\n    lower = text.lower()\n    if 'invoice' in lower or 'payment' in lower:\n        return 'billing'\n    if 'error' in lower or 'broken' in lower:\n        return 'technical'\n    return 'general'\n\nprint(route_request('My invoice is wrong'))\n`,check:['def route_request','billing','technical','general']},
 {id:'rag',phase:'RETRIEVAL',icon:'🔎',title:'RAG: Embeddings + Vector Search',why:'Ground answers in your own documents and data.',skills:['chunking','embeddings','pgvector','cosine distance','metadata','citations'],study:['Chunk for meaning, not merely fixed character counts.','Store useful metadata so retrieval can be filtered and explained.','Retrieval quality must be evaluated separately from generation quality.'],lab:'Implement a tiny cosine-similarity retriever over toy vectors.',starter:`import math\n\ndef cosine(a, b):\n    dot = sum(x*y for x,y in zip(a,b))\n    na = math.sqrt(sum(x*x for x in a))\n    nb = math.sqrt(sum(y*y for y in b))\n    return dot / (na * nb)\n\ndocs = [('amp repair',[0.9,0.1]),('cake order',[0.1,0.9])]\nquery = [0.8,0.2]\n# TODO: rank docs by cosine similarity\n`,check:['def cosine','sorted','reverse=True','query']},
 {id:'rag-quality',phase:'RETRIEVAL',icon:'🎯',title:'RAG Quality + Reranking',why:'Make retrieval measurable and trustworthy.',skills:['top-k','hybrid search','reranking','groundedness','citations','failure analysis'],study:['Good RAG begins with a test set of real questions and known relevant passages.','Measure recall/relevance before blaming the language model.','Require citations when the product needs verifiable claims.'],lab:'Create a small evaluation function that checks whether expected document IDs appear in top-k results.',starter:`def recall_at_k(results, expected_ids, k=3):\n    top = set(results[:k])\n    expected = set(expected_ids)\n    # TODO: fraction of expected IDs retrieved\n    return 0.0\n\nprint(recall_at_k(['d2','d1','d7'], ['d1']))\n`,check:['set(results[:k])','set(expected_ids)','intersection','return']},
 {id:'tests-evals',phase:'QUALITY',icon:'🧪',title:'Testing + AI Evals',why:'Prove ordinary code and model behaviour separately.',skills:['pytest','unit tests','integration tests','fixtures','golden sets','eval metrics'],study:['Unit-test deterministic business logic without calling a model.','Integration tests cover provider/database boundaries.','AI evals need representative datasets, explicit criteria and repeatable scoring.'],lab:'Write a deterministic evaluator for a classification output.',starter:`ALLOWED = {'billing','technical','general'}\n\ndef evaluate_label(actual: str, expected: str) -> dict:\n    # TODO: validate actual and report exact-match result\n    pass\n`,check:['ALLOWED','raise','actual == expected','return']},
 {id:'observability',phase:'QUALITY',icon:'📈',title:'Tracing, Reliability + Cost',why:'Production AI needs evidence when something goes wrong.',skills:['logs','traces','metrics','latency','cost','timeouts','fallbacks'],study:['Trace the request across retrieval, model and tool calls.','Track latency, error rate and model/token cost.','Retries must be bounded and should not duplicate side effects.'],lab:'Instrument a toy request pipeline with timings and correlation IDs.',starter:`import time, uuid\n\ndef traced_step(name, fn):\n    trace_id = str(uuid.uuid4())[:8]\n    start = time.perf_counter()\n    try:\n        result = fn()\n        # TODO: print success timing with trace_id\n        return result\n    except Exception:\n        # TODO: print failure timing and re-raise\n        raise\n`,check:['time.perf_counter','trace_id','except Exception','raise']},
 {id:'security-deploy',phase:'PRODUCTION',icon:'🔐',title:'Security, Docker + CI/CD',why:'Ship services safely and repeatedly.',skills:['secrets','prompt injection','least privilege','Docker','CI/CD','health checks'],study:['Keep API keys in secret stores/environment variables, never browser bundles.','Treat retrieved text and tool arguments as untrusted input.','Deploy from tested, reproducible builds with health checks and rollback.'],lab:'Write a security checklist function that rejects unsafe configuration.',starter:`def validate_config(cfg: dict):\n    # TODO: require API_BASE_URL and reject secrets marked as public\n    required = ['API_BASE_URL']\n    pass\n`,check:['required','API_BASE_URL','raise','return']},
 {id:'system-design',phase:'SENIOR ENGINEERING',icon:'🏗️',title:'Distributed AI System Design',why:'Reason about scale, failure and trade-offs.',skills:['queues','caching','idempotency','concurrency','backpressure','failure modes'],study:['Separate synchronous user paths from slow background work.','Use idempotency keys around retried writes and external actions.','Design degraded modes for provider, vector store and network failures.'],lab:'Sketch an idempotent job handler using a processed-key set.',starter:`processed = set()\n\ndef handle(job_id, payload):\n    if job_id in processed:\n        return 'duplicate ignored'\n    # TODO: perform work, then record completion\n    return 'done'\n`,check:['processed','if job_id in processed','processed.add','return']},
 {id:'portfolio',phase:'CAREER EVIDENCE',icon:'🧰',title:'Portfolio + Technical Communication',why:'Turn learning into evidence you can show and discuss.',skills:['README','architecture diagram','trade-offs','benchmarks','postmortem','demo'],study:['A strong project explains the problem, architecture, decisions, tests and limitations.','Record what you personally implemented and what AI assisted with.','Be ready to explain failures and trade-offs, not just the happy path.'],lab:'Write a project evidence record for one system you built.',starter:`PROJECT = {\n  'problem': '',\n  'my_contribution': '',\n  'architecture': '',\n  'tests': '',\n  'trade_offs': '',\n  'what_failed': '',\n  'next_step': ''\n}\n`,check:["'problem'","'my_contribution'","'tests'","'trade_offs'"]}
];
const v14Capstones=[
 {id:'rag-assistant',title:'Production RAG Assistant',desc:'FastAPI service that ingests documents, embeds/chunks them, retrieves with pgvector, answers with citations and runs an eval set.',checks:['API contract + Pydantic models','Chunking/embedding pipeline','Vector retrieval + metadata filters','Citations in answers','Retrieval + answer eval dataset','Tracing, timeout and error handling']},
 {id:'agent-support',title:'Multi-Agent Support Triage',desc:'A triage agent routes requests to specialist agents with explicit tools, handoffs, permissions and traces.',checks:['Typed tool schemas','Routing/handoffs','Least-privilege tools','Conversation state','Trace every tool call','Failure + escalation path']},
 {id:'ai-service',title:'Reliable LLM API Service',desc:'An async backend using structured outputs, retries, rate limits, caching, cost tracking and tests.',checks:['Async provider wrapper','Structured output validation','Bounded retries/timeouts','Rate limiting/cache','Unit + integration tests','Metrics and health endpoint']},
 {id:'system-design',title:'AI System Design Review',desc:'Design a scalable AI product and defend data flow, failure modes, queues, caching, security and deployment decisions.',checks:['Architecture diagram','Capacity assumptions','Failure-mode table','Idempotency + retries','Security boundaries','Deployment + rollback plan']}
];
const v14Weeks=[
 ['1–2','Production Python','typing, async, packaging, tests'],['3','FastAPI','validated APIs and service layers'],['4','LLM APIs','structured outputs, streaming, retries'],['5','Agents','tools, routing, handoffs, tracing'],['6–7','RAG','embeddings, pgvector, retrieval quality'],['8','Evals','datasets, metrics, regression checks'],['9','Reliability','observability, cost, failure handling'],['10','Security','prompt injection, permissions, secrets'],['11','Deploy','Docker, CI/CD, health + rollback'],['12','Capstone','portfolio evidence + interview defence']
];
function v14Pct(){return Math.round((v14.done.length/v14Modules.length)*100)}
function v14Done(id){return v14.done.includes(id)}
function v14Toggle(id){const i=v14.done.indexOf(id);if(i>=0)v14.done.splice(i,1);else v14.done.push(id);v14Save();renderV14()}
function v14Esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function v14ModuleCard(m,i){return `<div class="card v14Module ${v14Done(m.id)?'done':''}"><div class="v14ModuleTop"><div style="display:flex;gap:10px"><div class="v14Num">${i+1}</div><div><span class="eyebrow">${v14Esc(m.phase)}</span><h3>${m.icon} ${v14Esc(m.title)}</h3></div></div><span class="v14Status">${v14Done(m.id)?'✓ Complete':'To learn'}</span></div><p>${v14Esc(m.why)}</p><div class="v14Skills">${m.skills.map(x=>`<span class="v14Skill">${v14Esc(x)}</span>`).join('')}</div><div class="v14Actions"><button class="btn" onclick="openV14Study('${m.id}')">Study + lab</button><button class="btn secondary" onclick="v14Toggle('${m.id}')">${v14Done(m.id)?'Mark not complete':'Mark complete'}</button></div></div>`}
function renderV14(){
 const host=document.getElementById('ai-engineer'); if(!host)return; const pct=v14Pct();
 host.innerHTML=`<div class="v14Hero"><div class="card"><span class="eyebrow">AI ENGINEER CAREER PATH · 2026</span><h2>Python → APIs → LLMs → RAG → Agents → Production.</h2><p>This path upgrades Python Club from “learn some AI” into an engineering curriculum aimed at the skills used in modern AI product teams. It teaches the technical skills, gives you labs and capstones, and helps you collect evidence of what you can actually build.</p><div class="v14Warning"><b>Important:</b> completing lessons can build skill and portfolio evidence, but it cannot honestly replace an employer’s “5+ years” experience requirement. The app tracks what you can demonstrate rather than inventing experience.</div></div><div class="v14Score"><div><small>AI ENGINEER PATH</small><b>${pct}%</b><div class="progressbar"><i style="width:${pct}%"></i></div><span>${v14.done.length}/${v14Modules.length} modules completed</span></div></div></div>
 <div class="card v14Card"><span class="eyebrow">SYSTEM MAP</span><h2>See the whole AI application, not just the prompt.</h2><div class="v14Arch"><div class="v14Node"><b>Client</b><small>web / app</small></div><div class="v14Arrow">→</div><div class="v14Node"><b>FastAPI</b><small>validation + auth</small></div><div class="v14Arrow">→</div><div class="v14Node"><b>Agent / service</b><small>logic + tools</small></div><div class="v14Arrow">→</div><div class="v14Node"><b>LLM + RAG</b><small>model + vector DB</small></div></div><div class="v14Arch" style="margin-top:8px"><div class="v14Node"><b>Tests</b><small>deterministic</small></div><div class="v14Arrow">+</div><div class="v14Node"><b>Evals</b><small>quality dataset</small></div><div class="v14Arrow">+</div><div class="v14Node"><b>Tracing</b><small>latency/cost/errors</small></div><div class="v14Arrow">→</div><div class="v14Node"><b>Deploy</b><small>CI/CD + rollback</small></div></div></div>
 <div class="v14Phase">CORE MODULES</div><div class="v14ModuleGrid">${v14Modules.map(v14ModuleCard).join('')}</div>
 <div class="card v14Card" style="margin-top:14px"><span class="eyebrow">ROLE READINESS MATRIX</span><h2>What the app now teaches</h2><table class="v14Matrix"><thead><tr><th>Capability</th><th>Coverage</th><th>Evidence to create</th><th>Status</th></tr></thead><tbody>
 ${[['Strong Python','Production Python + async','Typed service + tests','prod-python'],['Production AI apps','LLM API + FastAPI + deploy','Running backend service','llm-api'],['RAG','Embeddings, pgvector, reranking','RAG assistant + eval set','rag'],['Agent workflows','Tools, routing, handoffs','Multi-agent capstone','agents'],['Testing/evals','pytest patterns + AI evals','Regression suite','tests-evals'],['Distributed systems','queues, caching, idempotency','System-design review','system-design'],['Operational reliability','tracing, metrics, cost','Dashboard/log evidence','observability'],['Security','secrets, prompt injection, least privilege','Threat model/checklist','security-deploy']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${v14Done(r[3])?'✓':'○'}</td></tr>`).join('')}</tbody></table></div>
 <div class="card v14Card" style="margin-top:14px"><span class="eyebrow">12-WEEK STUDY PLAN</span><h2>One focused route through the material.</h2><div class="v14Weeks">${v14Weeks.map(w=>`<div class="v14Week"><b>Week ${w[0]}</b><span>${w[1]}</span><small>${w[2]}</small></div>`).join('')}</div></div>
 <div style="margin-top:14px"><span class="v14Phase">CAPSTONES — BUILD EVIDENCE</span><div class="v14Capstones">${v14Capstones.map(c=>`<div class="card v14Capstone"><span class="eyebrow">CAPSTONE</span><h3>${v14Esc(c.title)}</h3><p>${v14Esc(c.desc)}</p>${c.checks.map(x=>`<div class="v14Check"><span>✓</span><div>${v14Esc(x)}</div></div>`).join('')}<button class="btn secondary" onclick="openV14Capstone('${c.id}')">Open checklist</button></div>`).join('')}</div></div>
 <div class="card v14Card" style="margin-top:14px"><span class="eyebrow">PORTFOLIO EVIDENCE</span><h2>For every serious project, save these three things.</h2><div class="v14Evidence"><div><b>1. Build evidence</b><p class="v14Tiny">Repository, README, tests, screenshots/demo, release.</p></div><div><b>2. Engineering evidence</b><p class="v14Tiny">Architecture, trade-offs, failure modes, security decisions.</p></div><div><b>3. Personal evidence</b><p class="v14Tiny">What you implemented, what AI helped with, what you can explain unaided.</p></div></div></div>
 <div class="card v14Card" style="margin-top:14px"><span class="eyebrow">VERIFIED DEEP-DIVE SOURCES</span><h2>Study the real libraries behind the concepts.</h2><div class="v14Resources"><div class="v14Resource"><a href="https://github.com/openai/openai-agents-python" target="_blank" rel="noopener">OpenAI Agents SDK ↗</a><p class="v14Tiny">Tools, agents, handoffs and tracing patterns.</p></div><div class="v14Resource"><a href="https://github.com/pgvector/pgvector-python" target="_blank" rel="noopener">pgvector Python ↗</a><p class="v14Tiny">Vector storage and similarity-search examples.</p></div><div class="v14Resource"><a href="https://github.com/fastapi/fastapi" target="_blank" rel="noopener">FastAPI ↗</a><p class="v14Tiny">Typed Python API framework and production patterns.</p></div></div></div>`;
}
function openV14Study(id){const m=v14Modules.find(x=>x.id===id);if(!m)return;modal.classList.remove('hidden');const saved=v14.labs[id]??m.starter;modalContent.innerHTML=`<div class="modalTop"><div><span class="eyebrow">${v14Esc(m.phase)} · STUDY + LAB</span><h2>${m.icon} ${v14Esc(m.title)}</h2></div><button class="ghost" onclick="closeModal()">Close</button></div><p>${v14Esc(m.why)}</p><div class="card" style="padding:16px"><h3>Study notes</h3>${m.study.map(x=>`<div class="v14Check"><span>•</span><div>${v14Esc(x)}</div></div>`).join('')}</div><h3 style="margin-top:18px">Lab</h3><p>${v14Esc(m.lab)}</p><div class="v14Lab"><div><textarea id="v14LabCode" class="v14Code">${v14Esc(saved)}</textarea><div class="v14Actions"><button class="btn" onclick="checkV14Lab('${id}')">Check my lab</button><button class="btn secondary" onclick="saveV14Lab('${id}')">Save</button></div></div><div><div id="v14LabResult" class="card" style="padding:16px"><b>Lab checks</b><p class="v14Tiny">Checks look for important concepts. You still need to understand and test the real project.</p></div><div class="card v14Quiz" style="padding:16px;margin-top:10px"><b>Quick knowledge check</b>${v14QuizFor(id)}</div></div></div>`}
function saveV14Lab(id){const code=document.getElementById('v14LabCode')?.value||'';v14.labs[id]=code;v14Save();const out=document.getElementById('v14LabResult');if(out)out.innerHTML='<b>Saved locally ✓</b><p class="v14Tiny">Your lab will be here next time on this device.</p>'}
function checkV14Lab(id){const m=v14Modules.find(x=>x.id===id),code=document.getElementById('v14LabCode')?.value||'',out=document.getElementById('v14LabResult');if(!m||!out)return;const results=m.check.map(x=>[x,code.includes(x)]);const passed=results.filter(x=>x[1]).length;out.innerHTML=`<b>${passed}/${results.length} concept checks passed</b>${results.map(x=>`<div class="v14Check"><span>${x[1]?'✓':'○'}</span><div>${v14Esc(x[0])}</div></div>`).join('')}<p class="v14Tiny">Passing string checks is not the same as proving production correctness. Run proper tests in a real Python environment for portfolio projects.</p>`;if(passed===results.length&&!v14Done(id)){v14.done.push(id);v14Save()}}
function v14QuizFor(id){const bank={
 'prod-python':['Why is bounded retry safer than retry forever?','It limits latency/cost and avoids endless failure loops','It makes Python synchronous','It hides every exception'],
 'fastapi':['Where should input validation happen?','At system boundaries with explicit models','Only in the browser','Only after database writes'],
 'llm-api':['Why prefer structured outputs for software workflows?','They make expected fields machine-validated','They always make answers factually correct','They remove the need for tests'],
 'agents':['What is a safe default for tools?','Least privilege: only the actions the task needs','Give every agent shell access','Let the model invent tool arguments'],
 'rag':['What should be measured separately in RAG?','Retrieval quality and generation quality','CSS and HTML','CPU fan speed'],
 'rag-quality':['What makes a useful RAG test set?','Real questions with expected relevant evidence','Only random prompts','Only successful production answers'],
 'tests-evals':['What should unit tests avoid when testing deterministic logic?','Unnecessary live model calls','Assertions','Fixtures'],
 'observability':['Why use correlation IDs?','To connect steps from one request across logs/traces','To encrypt embeddings','To replace authentication'],
 'security-deploy':['Where should production API secrets live?','Server-side secret management / environment configuration','Browser JavaScript','Public GitHub README'],
 'system-design':['Why use idempotency keys?','To make retried writes safe from duplicate side effects','To speed up CSS','To generate embeddings'],
 'portfolio':['What should you state clearly in a portfolio?','Your own contribution and trade-offs','That AI wrote everything','Only the final screenshot']};
 const q=bank[id]||['What is the goal of this module?','Understand and demonstrate the engineering concept','Memorise buzzwords','Skip testing'];return `<p>${v14Esc(q[0])}</p>${q.slice(1).map((a,i)=>`<button class="choice" onclick="answerV14Quiz(this,${i===0})">${v14Esc(a)}</button>`).join('')}<div id="v14QuizMsg" class="v14Tiny"></div>`}
function answerV14Quiz(btn,ok){btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');const m=document.getElementById('v14QuizMsg');if(m)m.textContent=ok?'Correct — explain why in your own words before moving on.':'Not quite. Re-read the study notes and try again.'}
function openV14Capstone(id){const c=v14Capstones.find(x=>x.id===id);if(!c)return;modal.classList.remove('hidden');const s=v14.capstones[id]||{};modalContent.innerHTML=`<div class="modalTop"><div><span class="eyebrow">CAPSTONE CHECKLIST</span><h2>${v14Esc(c.title)}</h2></div><button class="ghost" onclick="closeModal()">Close</button></div><p>${v14Esc(c.desc)}</p>${c.checks.map((x,i)=>`<label class="v14Check"><input type="checkbox" ${s[i]?'checked':''} onchange="saveV14Capstone('${id}',${i},this.checked)"><div><b>${v14Esc(x)}</b></div></label>`).join('')}<div class="v14Warning"><b>Portfolio rule:</b> do not mark a capstone complete until you can demo it, show tests/evidence and explain the design without relying on generated text.</div>`}
function saveV14Capstone(id,i,val){v14.capstones[id]=v14.capstones[id]||{};v14.capstones[id][i]=val;v14Save()}
function initV14(){const nav=document.querySelector('.tabs');if(!nav)return;if(!document.getElementById('ai-engineer')){const b=document.createElement('button');b.dataset.tab='ai-engineer';b.textContent='AI Engineer';const modern=nav.querySelector('[data-tab="modern"]');(modern||nav.lastElementChild)?.insertAdjacentElement(modern?'afterend':'beforebegin',b);const s=document.createElement('section');s.id='ai-engineer';s.className='panel';document.querySelector('main')?.appendChild(s)||document.body.appendChild(s)}nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;setTimeout(()=>{if(b.dataset.tab==='ai-engineer')renderV14()},30)},true);renderV14()}
initV14();
</script>
